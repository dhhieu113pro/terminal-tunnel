[package]
name = "terminal-tunnel"
version = "0.2.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive", "env"] }
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
portable-pty = "0.9.0"
qrcode = "0.14.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
lto = "thin"
